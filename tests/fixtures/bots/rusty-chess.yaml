version: 1
project: rusty-chess
repository: jwallace145/rusty-chess-v2

# The tags every resource carries (through the provider's default_tags), plus
# ManagedBy=jwall-engineering-infra, which the tool adds.
# Project, Repository and Environment=prod are cross-checked.
tags:
  Organization: jwall-engineering
  Project: rusty-chess
  Environment: prod
  Repository: jwallace145/rusty-chess-v2
  Owner: jwallace145

components:
  - kind: container-image
    architecture: x86_64            # x86_64 | arm64; must match the release asset
    artifact:                       # the release asset the image ships (never a rebuild)
      asset: rusty-chess-{version}-x86_64-unknown-linux-gnu.tar.gz
      checksum: rusty-chess-{version}-x86_64-unknown-linux-gnu.tar.gz.sha256
      binary: rusty-chess
    # dockerfile: docker/Dockerfile # optional: replace the harness-owned Dockerfile

  - kind: lichess-bot
    track: latest-release           # every published vX.Y.Z release is rolled out
    instance_type: t3.micro
    config: lichess/config.yml      # lichess-bot config with LICHESS_TOKEN_PLACEHOLDER
    lichess_user: rusty-chess-bot   # optional: for the profile URL in `bot status`
    secrets:
      LICHESS_TOKEN: /jwall-engineering/rusty-chess/lichess-token
    engine:
      hash_mb: 128                  # UCI Hash
      move_overhead_ms: 500         # UCI Move Overhead (lichess-bot's own move_overhead stays in config.yml)
    records:
      s3: true                      # sync game_records/ to s3://jwall-engineering-rusty-chess-records/records/
    logs:
      retention_days: 30

  - kind: task-runner               # optional: ephemeral EC2 instances for CI tasks (`task run`)
    instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge]  # the launch role's allow-list; SMT-off only
    default_instance_type: c8a.16xlarge  # 64 physical Zen 5 cores, the bot's core
    market: spot                    # spot | on-demand
    max_price_fraction: 0.58        # spot cap as a fraction of the on-demand price (about $2.00/h for c8a.16xlarge)
    on_demand_fallback: true        # on demand at launch only, after spot fails everywhere for spot_wait_minutes
    spot_wait_minutes: 5
    max_hours: 6                    # 1-6; an instance shuts itself down (and terminates) after this
    max_vcpus: 192                  # running task vCPUs per project; a launch over it waits for a slot
    slot_wait_minutes: 30           # how long `task run` waits for a slot before exiting 3
    results_days: 7                 # task outputs expire from S3 after this
    log_retention_days: 14

  - kind: dataset                   # optional: a kept-forever, append-only S3 bucket (docs/datasets.md)
    name: nnue
    bucket: jwall-engineering-rusty-chess-nnue  # <Organization>-<project>-<name>, written out for workflows
    prefix: data/                   # everything the project writes lives under it
    writers: [task-runner]          # task instances may add objects under the prefix, never read or delete
