# Tool-level configuration for jwall-engineering-sites, the CLI that provisions
# and publishes the sites. One top-level knob for everything about how the tool
# runs, as opposed to what one site is (that lives in each site repository's
# jwall-engineering-sites.yaml). The foundation stack reads the `aws`, `ecr` and
# `projects` sections with yamldecode; the CLI reads the whole file. Design:
# https://github.com/jwallace145/jwall-engineering-infra/pull/26

tool:
  log_level: info # JES_LOG_LEVEL overrides, for local debugging
  log_format: console # json in CI

terraform:
  version: 1.14.7
  lock_timeout: 120s
  plan_timeout: 15m

library:
  source: jwallace145/jwall-engineering/aws
  version: 0.17.0 # the one module pin the whole fleet shares (sites and bots)

state:
  bucket: jwall-engineering-tfstate
  region: us-east-1
  key_template: project={project}/env={environment}/{project}-{environment}.tfstate

aws:
  # The one account everything runs in. Workflows build role ARNs from it and
  # the project name, so no repository needs an account or role variable.
  account_id: "650503560686" # quoted: an account ID is a 12-digit string

context:
  organization: jwall-engineering
  owner: jwallace145

dns:
  zone: jwall.engineering
  zone_id: Z029546536VUFGDCPXZ21

ecr:
  repository: jwall-engineering-sites
  keep_release_images: 20
  expire_untagged_after_days: 7

sync:
  cache_control: public, max-age=3600 # assets without a content hash
  preview_cache_control: public, max-age=300
  html_cache_control: public, max-age=0, must-revalidate # pages: always fresh after a publish
  immutable_cache_control: public, max-age=31536000, immutable # site.immutable_paths

plan:
  comment_max_bytes: 60000

bot:
  # Bot projects (components: container-image + lichess-bot). The container
  # must log this within health_seconds after a deploy, or it is rolled back.
  health_log_pattern: awaiting challenges
  health_seconds: 90
  asset_wait: 30m # a release's Linux asset is attached after the release is published
  records_prefix: records/ # game records: <prefix>pgn|meta/schema=1/engine=<tag>/date=<day>/
  # Every zone that offers c8a (1e does not): spot tasks try each for capacity.
  # Append only: subnets are numbered by position, and the bot is in the first.
  availability_zones: [us-east-1a, us-east-1b, us-east-1c, us-east-1d, us-east-1f]
  # Pinned Amazon Linux 2023 image per architecture, by its Amazon image name.
  # The bot instance changes OS only when this changes (a PR whose bot plan shows
  # the replacement; Bot apply while the bot is idle). Name of the latest image:
  # aws ec2 describe-images --image-ids "$(aws ssm get-parameter --name
  #   /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  #   --query Parameter.Value --output text)" --query 'Images[0].Name' --output text
  amis:
    x86_64: al2023-ami-2023.12.20261026.1-kernel-6.18-x86_64 # ami-04b938437b69a2c9c in us-east-1

tasks:
  # Remote CI tasks (component task-runner, `task run`). The toolchain every
  # task instance installs; the current stable is the [pkg.rust] version in
  # https://static.rust-lang.org/dist/channel-rust-stable.toml
  rust_toolchain: 1.99.1
  poll_seconds: 5 # how often `task run` polls a task's output and status
  # Pinned images of task profiles (a profile's `image`), by Amazon-owned image
  # name; the bot stack resolves each to its ID. Upgrade by changing the pin.
  images:
    # NVIDIA driver and CUDA toolkit installed; ami-0f964da32f9793d2b (2026-10-28).
    deep-learning-gpu: Deep Learning Base OSS Nvidia Driver GPU AMI (Amazon Linux 2023) 20261027
  limits: # what any project file may ask for
    max_hours: 6 # GitHub stops a job at six hours; the launch role allows seven
    max_vcpus: 256
    root_volume_gb: 200 # the task-runner module's own upper bound is 200
  max_run_cost_usd: 50 # worst-case cost of one task; above it, the launch is refused

# Reviewed here; a project's own file cannot widen any of it. foundation/bots.tf
# reads the lists into the task launch role and the dataset policies, so they
# are the hard limit on what the project's pull requests can start. The
# allow-list of instance types is the hard limit on hourly cost, so review a
# new type's price with it. A `datasets` value is the bucket's approved
# retention: write_once, expire_prefixes, expire_noncurrent_days, versioning.
projects:
  rusty-chess:
    instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge, g6.xlarge, g6.2xlarge, g6e.xlarge]
    task_profiles: [cpu, gpu, sprt, match, datagen, relabel]
    datasets:
      jwall-engineering-rusty-chess-nnue: {}
    # max_run_cost_usd: 80 # optional per-project override of tasks.max_run_cost_usd
  databricks-poc:
    # A Databricks workspace project. `vpc_cidr` is allocated here so IP capacity is
    # central (/16 to /20; no overlap with another project or the bot VPC 10.0.0.0/16).
    databricks:
      compute_policies: [small-interactive, jobs]
      cost_center: cc-0000
      vpc_cidr: 10.40.0.0/16
      admins: [owner@example.com] # replace with the owner's email
      users: []

# Databricks workspaces (projects with a `databricks` entry above). The account
# stack uses a service principal whose client secret lives in SSM at
# `secret_parameter` (never in this file). Reviewed here; a project's own file
# cannot widen the compute policies or pick its own network range.
databricks:
  # Placeholders (the nil UUID) until the owner creates the service principal and
  # sets the secret; then replace both IDs and flip `enabled` to true. The foundation's
  # Databricks resources and the `live` checks wait for `enabled: true` and real IDs.
  enabled: false
  account_id: 00000000-0000-0000-0000-000000000000
  client_id: 00000000-0000-0000-0000-000000000000
  secret_parameter: /jwall-engineering/databricks/client-secret
  metastore_name: jwall-engineering-us-east-1
  # Replace the placeholder with the owner's email.
  metastore_admins: [owner@example.com]
  governance_project: databricks-poc # owns the metastore; needs a databricks entry below
  # Pinned Amazon Linux 2023 arm64 image for the NAT instance, by its Amazon image name.
  nat_ami: al2023-ami-2023.12.20261026.1-kernel-6.18-arm64
  audit_bucket: jwall-engineering-databricks-audit-logs
  events_prefix: events/
  readiness_timeout: 20m # how long apply waits for a new workspace to be RUNNING
  # Cluster policy definitions, by kebab-case name. A project lists the names it gets.
  compute_policies:
    small-interactive:
      description: Small interactive clusters on cheap Graviton spot nodes
      definition:
        num_workers: {type: range, maxValue: 2}
        autotermination_minutes: {type: fixed, value: 30, hidden: false}
        node_type_id: {type: allowlist, values: [m7g.large, m7g.xlarge]}
        aws_attributes.availability: {type: fixed, value: SPOT_WITH_FALLBACK}
    jobs:
      description: Job clusters, up to four workers
      definition:
        cluster_type: {type: fixed, value: job}
        num_workers: {type: range, maxValue: 4}
        node_type_id: {type: allowlist, values: [m7g.large, m7g.xlarge]}
        aws_attributes.availability: {type: fixed, value: SPOT_WITH_FALLBACK}
