[project]
name = "jwall-engineering-sites"
# The version lives in src/jwall_engineering_sites/__init__.py, bumped by
# Release Please. Keeping it out of pyproject.toml keeps it out of uv.lock, so
# a release PR does not invalidate the lock.
dynamic = ["version"]
description = "Provisions and publishes the jwall.engineering sites from one YAML file per site, wrapping Terraform and S3."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "typer>=0.17",
]

[project.scripts]
jwall-engineering-sites = "jwall_engineering_sites.cli:app"

[dependency-groups]
dev = [
  "boto3-stubs[cloudfront,s3,sts]>=1.40",
  "moto[s3,sts]>=5.1",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.13",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jwall_engineering_sites/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jwall_engineering_sites"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
