name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: us-east-1

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Dependabot's commit messages carry a capitalised subject and a release
    # notes body, which this repo's one-line rule rejects. Its PRs are squash
    # merged under a lowercase Conventional Commit title instead, so the
    # commit that lands on main still conforms. A skipped job satisfies the
    # required status check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit in the PR range is checked, so rebase merges land
          # only one-line Conventional Commits on main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in base..head
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
      - name: Unit test the only-coauthor-trailers rule
        run: npm test

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, so it must be a
      # valid Conventional Commit too.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            ci
            build
            perf
            style
            test
            revert
          requireScope: false
          # Dependabot titles start with a capital; they are retitled at merge.
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.

  terraform-static:
    name: Terraform fmt, validate, tflint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: foundation
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff
        working-directory: .
      - name: terraform init (no backend)
        uses: ./.github/actions/terraform-init
        with:
          args: -backend=false
      - name: terraform validate
        run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin downloads hit the unauthenticated API limit on shared runners
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --recursive

  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  site-stack:
    name: Site stack validate, tflint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: stacks/site
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
      - name: terraform init (no backend)
        uses: ./.github/actions/terraform-init
        with:
          args: -backend=false
          working-directory: stacks/site
      - name: terraform validate
        run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin downloads hit the unauthenticated API limit on shared runners
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"


  bot-stack:
    name: Bot stack validate, tflint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: stacks/bot
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
      - name: terraform init (no backend)
        uses: ./.github/actions/terraform-init
        with:
          args: -backend=false
          working-directory: stacks/bot
      - name: terraform validate
        run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin downloads hit the unauthenticated API limit on shared runners
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read the Terraform version from config.yaml
        id: config
        run: echo "terraform_version=$(yq -r .terraform.version config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jwall-engineering-sites:ci
          build-args: TERRAFORM_VERSION=${{ steps.config.outputs.terraform_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (validate a fixture site offline, inside the image)
        run: |
          # A writable copy: the tool writes its artifacts and debug log into the workspace.
          cp -r tests/fixtures/sites "$RUNNER_TEMP/site"
          docker run --rm --network none \
            -v "$RUNNER_TEMP/site:/work" \
            jwall-engineering-sites:ci --file guitar-knowledge-base.yaml validate
          test -s "$RUNNER_TEMP/site/.jwall-engineering-sites/jwall-engineering-sites.log"
      - name: Smoke test (the image's Terraform matches config.yaml)
        run: docker run --rm --network none --entrypoint terraform jwall-engineering-sites:ci version
      - name: Smoke test (the pruned botocore still serves the clients the tool uses)
        run: |
          docker run --rm --network none --entrypoint python jwall-engineering-sites:ci -c '
          import boto3
          for service in ("s3", "sts", "cloudfront", "ssm", "ec2", "logs", "ecr"):
              boto3.session.Session(region_name="us-east-1").client(service)
          print("boto3 clients ok")'
      - name: Image size budget
        env:
          MAX_COMPRESSED_MB: "250" # what a consumer downloads; the AWS provider archive alone is ~130 MB
        run: |
          uncompressed=$(docker image inspect jwall-engineering-sites:ci --format '{{.Size}}')
          compressed=$(docker save jwall-engineering-sites:ci | gzip -1 | wc -c)
          u_mb=$((uncompressed / 1024 / 1024)); c_mb=$((compressed / 1024 / 1024))
          printf '## Image size\n\n- compressed (network): %s MB (budget %s MB)\n- uncompressed: %s MB\n' "$c_mb" "$MAX_COMPRESSED_MB" "$u_mb" >> "$GITHUB_STEP_SUMMARY"
          echo "compressed ${c_mb} MB, uncompressed ${u_mb} MB"
          if [ "$c_mb" -gt "$MAX_COMPRESSED_MB" ]; then
            echo "::error::the image is ${c_mb} MB compressed, over the ${MAX_COMPRESSED_MB} MB budget"
            exit 1
          fi

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [terraform-static]
    permissions:
      contents: read
      id-token: write # assume the plan role through GitHub OIDC
      pull-requests: write # post and update the plan comment
    defaults:
      run:
        working-directory: foundation
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-pr-${{ github.event.pull_request.number }}
      - name: terraform init
        uses: ./.github/actions/terraform-init
        with:
          args: -backend-config=backend/prod.hcl
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=60s -out=tfplan -detailed-exitcode > plan.log 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.log
          # 0 = no changes, 2 = changes, anything else = error
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - uses: astral-sh/setup-uv@v7
        if: always() && steps.plan.outcome != 'skipped'
        with:
          enable-cache: true
      - name: Build plan comment (the sites CLI renders it, so it matches the site repos)
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: .
        env:
          JES_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv sync --locked
          uv run jwall-engineering-sites report plan-comment \
            --exit-code "${{ steps.plan.outputs.exitcode }}" \
            --plan foundation/plan.log \
            --subject jwall-engineering-infra/foundation \
            --out foundation/plan-comment.md
      - name: Mint a comment token for the JWall Engineering Sites app
        id: app-token
        if: always() && steps.plan.outcome != 'skipped' && vars.JES_APP_CLIENT_ID != ''
        continue-on-error: true # a misconfigured app falls back to github-actions
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JES_APP_CLIENT_ID }}
          private-key: ${{ secrets.JES_APP_PRIVATE_KEY }}
      - name: Post plan comment (updated on each push)
        if: always() && steps.plan.outcome != 'skipped'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: terraform-plan
          path: foundation/plan-comment.md
