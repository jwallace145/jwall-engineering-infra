name: Release

# Merges to main accumulate changes in a Release Please PR. Merging that PR is
# the deliberate, human-reviewed act that releases a tag and applies the
# Terraform against it.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: us-east-1

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that release PRs are authored
      # by jwallace145-release-bot[bot] and CI runs on them.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apply:
    name: Terraform apply (${{ needs.release-please.outputs.tag_name }})
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      id-token: write # assume the apply role through GitHub OIDC
    defaults:
      run:
        working-directory: foundation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ needs.release-please.outputs.tag_name }}
      - name: terraform init
        uses: ./.github/actions/terraform-init
        with:
          args: -backend-config=backend/prod.hcl
      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=120s -out=tfplan
      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=120s tfplan

  image:
    name: Publish image (${{ needs.release-please.outputs.tag_name }})
    runs-on: ubuntu-latest
    needs: [release-please, apply]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write # assume the apply role, which holds ecr/push
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Read the image settings from config.yaml
        id: config
        run: |
          echo "terraform_version=$(yq -r .terraform.version config.yaml)" >> "$GITHUB_OUTPUT"
          echo "repository=$(yq -r .ecr.repository config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-image-${{ needs.release-please.outputs.tag_name }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.config.outputs.repository }}:${{ needs.release-please.outputs.tag_name }}
          build-args: TERRAFORM_VERSION=${{ steps.config.outputs.terraform_version }}
      - name: Summary
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ steps.config.outputs.repository }}:${{ needs.release-please.outputs.tag_name }}
        run: printf '## Image\n\n- `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
