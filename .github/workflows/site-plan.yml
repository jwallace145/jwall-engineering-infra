name: Site plan

# Reusable: validates a site repository's jwall-engineering-sites.yaml, plans
# its infrastructure as the plan role and posts the plan as a sticky comment.
# Call it from the site's pull request workflow; skip it on `edited` events.
# Pass `app-client-id` and the `app-private-key` secret to post the comment as the
# JWall Engineering Sites GitHub App instead of github-actions.

on:
  workflow_call:
    inputs:
      plan-role-arn:
        description: ARN of the site's ci-plan role (usually vars.AWS_PLAN_ROLE_ARN).
        required: true
        type: string
      app-client-id:
        description: ID of the JWall Engineering Sites GitHub App that authors the comment (usually vars.JES_APP_CLIENT_ID). Empty posts as github-actions.
        required: false
        type: string
        default: ""
      debug:
        description: Console log at debug level.
        required: false
        type: boolean
        default: false
    secrets:
      app-private-key:
        description: Private key of the JWall Engineering Sites GitHub App (usually secrets.JES_APP_PRIVATE_KEY). Needed with app-client-id.
        required: false

permissions: {}

jobs:
  plan:
    name: jwall-engineering-sites plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the plan role, through OIDC
      pull-requests: write # the sticky plan comment
    steps:
      - uses: actions/checkout@v7
      - name: Check out jwall-engineering-infra at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: jwallace145/jwall-engineering-infra
          ref: ${{ github.job_workflow_sha }}
          path: .jwall-engineering-infra
      - name: validate
        uses: ./.jwall-engineering-infra/.github/actions/jwall-engineering-sites
        with:
          command: validate
          role-arn: ${{ inputs.plan-role-arn }}
          debug: ${{ inputs.debug }}
      - name: plan
        id: plan
        uses: ./.jwall-engineering-infra/.github/actions/jwall-engineering-sites
        with:
          command: plan
          role-arn: ${{ inputs.plan-role-arn }}
          debug: ${{ inputs.debug }}
      - name: Mint a comment token for the JWall Engineering Sites app
        id: app-token
        if: always() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request' && inputs.app-client-id != ''
        continue-on-error: true # a misconfigured app falls back to github-actions
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Post the plan comment (updated on each push)
        if: always() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: terraform-plan
          path: .jwall-engineering-sites/plan-comment.md
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jwall-engineering-sites-${{ github.job }}-${{ github.run_attempt }}
          path: .jwall-engineering-sites/
          retention-days: 14
          if-no-files-found: ignore
