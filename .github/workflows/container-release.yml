name: Container release

# Reusable: a bot repository calls this when it publishes a release. It
# builds the image from the release's verified Linux asset, smoke-tests it,
# pushes it to ECR under the release tag, and rolls the bot to it; the bot
# finishes the game in progress first, so this job can wait that long.
# `bot reconcile` is idempotent: re-running a release is harmless.
#
# The CLI runs from this workflow's own commit (github.job_workflow_sha), so
# the tag the caller pins selects the tool version. It runs with uv rather
# than the CLI image because the build needs Docker on the runner.
#
# Caller (in the bot repository):
#
#   on:
#     release:
#       types: [published]
#   permissions: {}
#   jobs:
#     release:
#       uses: jwallace145/jwall-engineering-infra/.github/workflows/container-release.yml@vX.Y.Z
#       with:
#         project: rusty-chess
#       permissions:
#         contents: read
#         id-token: write

on:
  workflow_call:
    inputs:
      project:
        description: The project name in jwall-engineering-sites.yaml. The release role is derived from it.
        required: true
        type: string
      version:
        description: Release tag to ship; defaults to the published release's tag.
        required: false
        type: string
        default: ""
      release-role-arn:
        description: Override the release role. Default, derived from this tool's config.yaml and `project`, `arn:aws:iam::<account>:role/<organization>-<project>-ci-release`.
        required: false
        type: string
        default: ""
      debug:
        description: Console log at debug level.
        required: false
        type: boolean
        default: false

concurrency:
  group: container-release-${{ inputs.project }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build, push and deploy ${{ inputs.version || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240 # a rollout waits for the game in progress
    permissions:
      contents: read
      id-token: write # the release role, through OIDC
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version || github.event.release.tag_name }}
      - name: Check out jwall-engineering-infra at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: jwallace145/jwall-engineering-infra
          ref: ${{ github.job_workflow_sha }}
          path: .jwall-engineering-infra
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev --project .jwall-engineering-infra
      - name: Resolve the release role
        id: role
        env:
          OVERRIDE: ${{ inputs.release-role-arn }}
          PROJECT: ${{ inputs.project }}
          CONFIG: .jwall-engineering-infra/config.yaml
        run: |
          if [ -n "$OVERRIDE" ]; then
            arn="$OVERRIDE"
          else
            account=$(yq -r .aws.account_id "$CONFIG")
            organization=$(yq -r .context.organization "$CONFIG")
            [[ "$account" =~ ^[0-9]{12}$ && -n "$organization" && "$organization" != null ]] || { echo "::error::$CONFIG has no aws.account_id or context.organization"; exit 1; }
            arn="arn:aws:iam::${account}:role/${organization}-${PROJECT}-ci-release"
          fi
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-east-1
          role-session-name: container-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: jwall-engineering-sites bot reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }} # release listing (rate limits)
          JES_HEAD_SHA: ${{ github.sha }}
          DEBUG: ${{ inputs.debug }}
        run: |
          debug_flag=""
          if [ "$DEBUG" = "true" ]; then debug_flag="--debug"; fi
          # shellcheck disable=SC2086
          uv run --no-dev --project .jwall-engineering-infra jwall-engineering-sites \
            --config .jwall-engineering-infra/config.yaml $debug_flag \
            bot reconcile --version "$VERSION"
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-release-${{ github.run_attempt }}
          path: .jwall-engineering-sites/
          retention-days: 14
          if-no-files-found: ignore
