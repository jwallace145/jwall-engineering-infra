name: Databricks credentials
description: >-
  For the foundation's Databricks resources (foundation/databricks.tf). When
  config.yaml's databricks.enabled is true, reads the service principal's
  client secret from SSM with the AWS role already assumed, masks it, and
  exports DATABRICKS_ACCOUNT_ID, DATABRICKS_CLIENT_ID (both from config.yaml)
  and DATABRICKS_CLIENT_SECRET to the job's later steps, where the databricks
  provider reads them. While it is false it does nothing: the foundation then
  plans no Databricks resources and needs no credential.

inputs:
  config:
    description: Path of config.yaml, relative to the workspace.
    required: false
    default: config.yaml

runs:
  using: composite
  steps:
    - name: Read the Databricks credential (when databricks.enabled)
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        enabled=$(yq -r .databricks.enabled "$CONFIG")
        if [ "$enabled" != "true" ]; then
          echo "databricks.enabled is $enabled in $CONFIG: no Databricks credential is needed"
          exit 0
        fi
        account_id=$(yq -r .databricks.account_id "$CONFIG")
        client_id=$(yq -r .databricks.client_id "$CONFIG")
        parameter=$(yq -r .databricks.secret_parameter "$CONFIG")
        v=$(aws ssm get-parameter --with-decryption --name "$parameter" --query Parameter.Value --output text)
        # A mask covers one line; refuse anything else without printing it.
        if [ -z "$v" ] || [[ "$v" == *$'\n'* ]]; then
          echo "::error::$parameter is empty or spans several lines; set it again with databricks credentials set"
          exit 1
        fi
        # Mask first: nothing may print or export the secret before this line.
        echo "::add-mask::$v"
        {
          echo "DATABRICKS_ACCOUNT_ID=$account_id"
          echo "DATABRICKS_CLIENT_ID=$client_id"
          echo "DATABRICKS_CLIENT_SECRET=$v"
        } >> "$GITHUB_ENV"
        echo "Databricks credential for account $account_id exported (masked)"
